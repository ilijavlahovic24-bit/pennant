run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - gosec

linters-settings:
  goimports:
    local-prefixes: pennant/backend

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec