name: CD

on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25.3"

jobs:
  publish:
    name: Publish backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod matches CD Go version
        working-directory: backend
        run: |
          GO_MOD_VERSION=$(grep -E '^go ' go.mod | awk '{print $2}')
          echo "go.mod: $GO_MOD_VERSION, CD: ${{ env.GO_VERSION }}"
          if [[ "$GO_MOD_VERSION" != "${{ env.GO_VERSION }}" ]]; then
            echo "::error::go.mod version ($GO_MOD_VERSION) does not match CD GO_VERSION (${{ env.GO_VERSION }})"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pennant-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max